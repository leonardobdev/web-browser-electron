<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>wb</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="controls">
        <button id="back-btn" disabled>&lt;</button>
        <button id="forward-btn" disabled>&gt;</button>
        <button id="reload-btn">Refresh</button>
        <input type="text" id="url-input" placeholder="https://">
    </div>
    <webview id="webview" src="https://www.google.com" style="width:100%; height:calc(100% - 40px);"></webview>

    <script>
        const backBtn = document.getElementById('back-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const urlInput = document.getElementById('url-input');
        const webview = document.getElementById('webview');

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                let url = urlInput.value;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                webview.loadURL(url);
            }
        });

        backBtn.addEventListener('click', () => {
            if (webview.canGoBack()) {
                webview.goBack();
            }
        });

        forwardBtn.addEventListener('click', () => {
            if (webview.canGoForward()) {
                webview.goForward();
            }
        });

        reloadBtn.addEventListener('click', () => {
            webview.reload();
        });

        webview.addEventListener('did-navigate', (e) => {
            urlInput.value = e.url;
            backBtn.disabled = !webview.canGoBack();
            forwardBtn.disabled = !webview.canGoForward();
        });

        webview.addEventListener('did-navigate-in-page', (e) => {
            urlInput.value = e.url;
        });

        window.addEventListener('DOMContentLoaded', () => {
        });
    </script>
</body>

</html>
