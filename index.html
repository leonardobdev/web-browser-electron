<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wb</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .controls {
            display: flex;
            align-items: center;
            padding: 5px;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
            height: 40px;
            box-sizing: border-box;
        }

        button {
            margin-right: 5px;
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background-color: #fff;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #url-input {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        webview {
            width: 100%;
            height: calc(100% - 40px);
        }
    </style>
</head>

<body>
    <div class="controls">
        <button id="back-btn" disabled>&lt;</button>
        <button id="forward-btn" disabled>&gt;</button>
        <button id="reload-btn">Refresh</button>
        <input type="text" id="url-input" placeholder="https://" value="https://duckduckgo.com">
    </div>
    <webview src="https://duckduckgo.com"></webview>

    <script>
        const $ = e => document.querySelector(e);
        $('#url-input').addEventListener('keypress', (e) => {
            if (e.key !== 'Enter') return;
            let url = $('#url-input').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                const regexp = /^((\d{1,3}\.){3}\d{1,3}|localhost|([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,})(:\d+)?(\/|$)/;
                if (regexp.test(url)) {
                    if (!url.startsWith('localhost') && !url.startsWith('127.0.0.1')) {
                        url = 'https://' + url;
                    } else {
                        url = 'http://' + url;
                    }
                } else {
                    url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
                }
            }
            $('webview').loadURL(url);
            $('#back-btn').disabled = !$('webview').canGoBack();
            $('#forward-btn').disabled = !$('webview').canGoForward();
        });

        $('#back-btn').addEventListener('click', () => {
            if (!$('webview').canGoBack()) return;
            $('webview').goBack();
            $('#back-btn').disabled = !$('webview').canGoBack();
            $('#forward-btn').disabled = !$('webview').canGoForward();
        });

        $('#forward-btn').addEventListener('click', () => {
            if (!$('webview').canGoForward()) return;
            $('webview').goForward();
            $('#back-btn').disabled = !$('webview').canGoBack();
            $('#forward-btn').disabled = !$('webview').canGoForward();
        });

        $('#reload-btn').addEventListener('click', () => {
            $('webview').reload();
            $('#back-btn').disabled = !$('webview').canGoBack();
            $('#forward-btn').disabled = !$('webview').canGoForward();
        });

        $('webview').addEventListener('did-navigate', (e) => {
            $('#url-input').value = e.url;
            $('#back-btn').disabled = !$('webview').canGoBack();
            $('#forward-btn').disabled = !$('webview').canGoForward();
        });

        $('webview').addEventListener('did-navigate-in-page', (e) => {
            $('#url-input').value = e.url;
            $('#back-btn').disabled = !$('webview').canGoBack();
            $('#forward-btn').disabled = !$('webview').canGoForward();
        });

        window.addEventListener('DOMContentLoaded', () => { });
    </script>
</body>

</html>
